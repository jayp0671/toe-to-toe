name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 3.4.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime
      - name: Database tests
        run: pnpm test:db
      - name: Function tests
        run: pnpm test:functions
      - name: Season simulation (9 players, 31 days, ET + PT)
        run: pnpm sim --players 9 --month 2027-01 --zones ET,PT --seed 42
      - name: End-to-end
        run: pnpm e2e
      - name: Build
        run: pnpm build
